<template id="tpl-start">
  <h1>Prep for the UI mock-up round</h1>
  <p class="lede">Everything you need for Wednesday is in here: lessons, quizzes, a workspace modeled on CodeSignal, short drills, from-memory speed runs, a lookup trainer for anything you weren't taught, and three timed mock interviews.</p>

  <h2>What the round is</h2>
  <p>From your recruiter packet:</p>
  <ul>
    <li>You work in <strong>React inside CodeSignal</strong> and implement a feature from a <strong>Figma mockup</strong>.</li>
    <li>You get an <strong>existing codebase</strong> to understand and extend. You are not starting from a blank file.</li>
    <li>You share your screen in <strong>Google Meet</strong>. <strong>No AI tools.</strong></li>
  </ul>
  <p>So this is not an algorithms round and not React trivia. It is the job, compressed: read some code, read a design, build the feature, keep it working, and talk while you do it.</p>

  <div class="callout is-key"><span class="callout-label">The most useful thing to know</span>
    <p>A half-finished UI with a clear plan, a running build and narrated decisions beats a fully styled page hacked together. Interviewers watch <em>how</em> you work at least as much as what is on screen at minute 60.</p></div>

  <h2>How this kit works</h2>
  <div class="table-wrap"><table>
    <tr><th>Part</th><th>What you do</th><th>Time</th></tr>
    <tr><td>CSS, React and JavaScript lessons</td><td>Learn the mental model, then change live examples right in the lesson and watch what happens. A quiz at the end of each</td><td>20–30 min each</td></tr>
    <tr><td>Name it, search it</td><td>Break down an unfamiliar requirement, name the pieces, write the queries. For everything you weren't taught</td><td>~1 min per scenario</td></tr>
    <tr><td>Curveballs</td><td>Exercises built on things the kit never taught, solved with Google and MDN</td><td>30 min</td></tr>
    <tr><td>Drills</td><td>One skill at a time, with a target design and a starter</td><td>15–20 min</td></tr>
    <tr><td>Speed runs</td><td>The same patterns from blank files, from memory</td><td>20–25 min</td></tr>
    <tr><td>Mock interviews</td><td>A realistic codebase, a Figma-like target, a timer and a surprise requirement</td><td>55 min + debrief</td></tr>
  </table></div>
  <p>The workspace runs real React 18 in your browser: file tree, editor, live preview, terminal and console. It has <strong>no autocomplete on purpose</strong>, because you won't have AI help in the interview. The Design tab has an <strong>Inspect</strong> mode that works like Figma's: hover any element to read its size, padding, colors and type.</p>
  <p>Your progress, code and quiz answers are saved in this browser.</p>

  <h2>Do these today (from the packet)</h2>
  <ul data-checklist="packet">
    <li data-id="figma">Create a Figma account and finish the onboarding flow<small>Then open any file from the Figma Community and click around: select layers, read the right-hand panel.</small></li>
    <li data-id="meet">Test screen sharing in Google Meet in the browser you'll use<small>On a Mac: System Settings → Privacy &amp; Security → Screen Recording must allow your browser. That setting needs a browser restart.</small></li>
    <li data-id="recruiter">Ask the recruiter four quick questions<small>How long is the coding part? JavaScript or TypeScript? How is the codebase styled (plain CSS, CSS modules, Tailwind)? Can I look things up on MDN or Google?</small></li>
  </ul>
</template>

<template id="tpl-scoring">
  <h1>What gets scored</h1>
  <p class="lede">Nobody publishes the rubric. This ranking comes from an experienced frontend engineer who prepped people for this format, and it matches how UI rounds like this are usually judged.</p>

  <div class="table-wrap"><table>
    <tr><th>#</th><th>Signal</th><th>What it looks like on the call</th></tr>
    <tr><td>1</td><td><strong>Codebase comprehension</strong></td><td>You find and reuse what exists: helpers, components, CSS variables, patterns. You say "this repo does X, so I'll follow it."</td></tr>
    <tr><td>2</td><td><strong>Requirements triage</strong></td><td>You scope out loud: "I'll do A and B fully, the happy path of C, and stub D." Then you deliver exactly that.</td></tr>
    <tr><td>3</td><td><strong>Clean decomposition</strong></td><td>Small components with clear prop names. State in the right place. No 200-line JSX blob.</td></tr>
    <tr><td>4</td><td><strong>Edge-case awareness</strong></td><td>Loading, empty and error states. Long text. Keyboard, focus styles, labels.</td></tr>
    <tr><td>5</td><td><strong>Calm debugging</strong></td><td>You read the error, form a guess, check it. No panic, no random changes.</td></tr>
    <tr><td>6</td><td><strong>Visual fidelity</strong></td><td>Layout, spacing and type match the mockup closely. Pixel perfection comes last.</td></tr>
  </table></div>

  <h2>What this means for how you spend time</h2>
  <ul>
    <li><strong>Spend the first 5 minutes reading, not typing.</strong> It feels slow. It is what scores highest.</li>
    <li><strong>Say your scope before you code.</strong> Then any unfinished part is a decision you made, not a failure.</li>
    <li><strong>Never leave the build broken.</strong> Work in increments that each run.</li>
    <li><strong>Polish last.</strong> A correct layout with slightly-off padding beats perfect padding on a broken feature.</li>
  </ul>
  <p>Mantra: <strong>comprehension → decomposition → working increments → polish.</strong></p>
</template>

<template id="tpl-playbook">
  <h1>The in-round playbook</h1>
  <p class="lede">The same seven phases every time, so you never have to decide what to do next. Times assume 60 minutes of coding; scale them if your round is longer.</p>

  <ol class="phases">
    <li class="phase"><span class="phase-time">0–5</span><div><h3>Read</h3><p>Read the whole task once. Open the design. Skim the codebase (see Reading a codebase fast). Ask one to three clarifying questions.</p><div class="phase-bar" style="width:8%"></div></div></li>
    <li class="phase"><span class="phase-time">5–8</span><div><h3>Plan and scope out loud</h3><p>Write a short comment: components, state, data. Say what you'll do fully, what gets the happy path only, and what you'll skip unless there's time.</p><div class="phase-bar" style="width:5%"></div></div></li>
    <li class="phase"><span class="phase-time">8–20</span><div><h3>Structure</h3><p>Render the real data with plain JSX and no styling. Split components now. Get it on screen.</p><div class="phase-bar" style="width:20%"></div></div></li>
    <li class="phase"><span class="phase-time">20–35</span><div><h3>Behavior</h3><p>Add state and handlers one interaction at a time. Check the preview after each.</p><div class="phase-bar" style="width:25%"></div></div></li>
    <li class="phase"><span class="phase-time">35–42</span><div><h3>States</h3><p>Loading, empty, error, long text, disabled buttons.</p><div class="phase-bar" style="width:12%"></div></div></li>
    <li class="phase"><span class="phase-time">42–55</span><div><h3>Polish</h3><p>CSS against the design, biggest differences first: layout → spacing → type → color → hover and focus.</p><div class="phase-bar" style="width:22%"></div></div></li>
    <li class="phase"><span class="phase-time">55–60</span><div><h3>Walk through</h3><p>Demo it, name what you'd improve next, mention tradeoffs.</p><div class="phase-bar" style="width:8%"></div></div></li>
  </ol>

  <h2>A planning comment is worth writing</h2>
  <p>Typing your plan at the top of the file takes 90 seconds. The interviewer sees your thinking, and you get a checklist.</p>
  <script type="text/x-code" data-lang="jsx" data-title="Sidebar.jsx (top of file)">
/*
  Plan
  - Sidebar: fetch conversations (exists), hold query + list state
  - derived: filter by query -> sort by date -> group with getDateGroup()
  - ConversationItem: title + star button (sibling buttons, not nested)
  Scope: all requirements; skip keyboard navigation unless there's time
*/
</script>

  <h2>Rules that save you</h2>
  <ul>
    <li><strong>Hardcode first, generalize second.</strong> Get one card right, then <code>.map()</code> it.</li>
    <li><strong>Run constantly.</strong> Every 2–3 minutes. Small breakages are easy; big ones eat 10 minutes.</li>
    <li><strong>Need something you don't know?</strong> Name it, search it, give it 2 minutes (see Thinking in lookups). Say the name out loud before you search.</li>
    <li><strong>Stuck for 3 minutes?</strong> Say so, state your guess and simplify. "I'll use a plain list here and come back to the animation."</li>
    <li><strong>Don't refactor early.</strong> Ugly but working at minute 30 is fine. Clean it up at the end if there's time.</li>
    <li><strong>Requirement changes are expected.</strong> Stop, re-read, say where it fits, make the smallest change.</li>
  </ul>
</template>

<template id="tpl-codebase">
  <h1>Reading a codebase fast</h1>
  <p class="lede">The packet says you'll "understand and extend" an existing codebase. That is a scored skill, not a warm-up. Five minutes, in this order.</p>

  <h2>The five-minute read</h2>
  <ol>
    <li><strong>The file tree.</strong> Names tell you the architecture: <code>components/</code>, <code>pages/</code>, <code>utils/</code>, <code>hooks/</code>, <code>api.js</code>. Is there a <code>package.json</code>? Check dependencies: a styling library, TypeScript, a router.</li>
    <li><strong>Top of the render tree.</strong> <code>index.jsx</code> → <code>App.jsx</code> → the file the task names. Now you know where your feature mounts and what props it gets.</li>
    <li><strong>Where data comes from.</strong> Open the API or data file. What shape is it? Is it async? Which functions exist? You should not write a fetch that already exists.</li>
    <li><strong>How styling works.</strong> One global CSS file? CSS modules? <strong>CSS variables at the top</strong> (<code>--color-muted</code>)? Use them instead of hex codes.</li>
    <li><strong>What you can reuse.</strong> Shared <code>Button</code>, <code>Avatar</code>, <code>Icon</code>, <code>formatDate</code>. Reuse them and say so.</li>
  </ol>

  <h2>Then match the conventions</h2>
  <ul>
    <li>Default or named exports? Do the same.</li>
    <li>How are class names written: <code>is-active</code>, BEM, camelCase? Match it.</li>
    <li>Where does state live in similar components? Follow it.</li>
    <li>Function components with hooks? (Almost certainly.) Don't introduce a new pattern.</li>
  </ul>

  <div class="callout is-key"><span class="callout-label">Say it out loud</span>
    <p>"I see there's a <code>getDateGroup</code> helper and an <code>Icon</code> component, and the CSS uses variables, so I'll build on those." One sentence like this tells the interviewer more than ten minutes of silent coding.</p></div>

  <h2>Practice</h2>
  <p>In each mock interview, before writing any code, set a 5-minute timer and answer: where does my component mount, what data comes in, what can I reuse, how is styling done? The mocks hide useful helpers on purpose.</p>
  <div data-quiz="codebase"></div>
</template>

<template id="tpl-figma">
  <h1>Figma to CSS</h1>
  <p class="lede">You don't need to be a designer. You need to read numbers off a Figma file and translate them to CSS quickly.</p>

  <h2>Figma in five minutes</h2>
  <ul>
    <li><strong>Left panel:</strong> layers. Frames are containers, like divs. Click to select.</li>
    <li><strong>Right panel:</strong> properties of the selection: size, auto layout, fill, stroke, effects, text. With view-only access you may see an Inspect or Dev Mode panel with CSS instead. The numbers are the same either way.</li>
    <li><strong>Measure spacing:</strong> select one layer, hold <span class="kbd">Alt</span> (<span class="kbd">Option</span> on Mac) and hover another. Figma shows the distance in red.</li>
    <li><strong>Zoom:</strong> <span class="kbd">Shift</span> <span class="kbd">2</span> zooms to the selection, <span class="kbd">Shift</span> <span class="kbd">1</span> fits everything. Hold <span class="kbd">Space</span> and drag to pan.</li>
    <li><strong>Select deep:</strong> <span class="kbd">Cmd/Ctrl</span>-click selects the innermost layer under the cursor.</li>
  </ul>

  <h2>The translation table</h2>
  <div class="table-wrap"><table>
    <tr><th>Figma</th><th>CSS</th></tr>
    <tr><td>Auto layout, horizontal / vertical</td><td><code>display: flex</code> + <code>flex-direction: row / column</code></td></tr>
    <tr><td>Spacing between items</td><td><code>gap</code></td></tr>
    <tr><td>Padding</td><td><code>padding</code> (Figma lists it in the same order: top, right, bottom, left)</td></tr>
    <tr><td>Alignment (the 9-dot grid)</td><td><code>justify-content</code> on the main axis, <code>align-items</code> on the cross axis</td></tr>
    <tr><td>Spacing mode "Auto" (space between)</td><td><code>justify-content: space-between</code></td></tr>
    <tr><td>Width "Hug contents"</td><td>Nothing (auto), or <code>width: fit-content</code></td></tr>
    <tr><td>Width "Fill container"</td><td><code>flex: 1</code> along the main axis (+ <code>min-width: 0</code> if it holds text); <code>align-self: stretch</code> or <code>width: 100%</code> across it</td></tr>
    <tr><td>Width "Fixed"</td><td><code>width: 240px</code> (and <code>flex-shrink: 0</code> if it must not squish)</td></tr>
    <tr><td>Fill</td><td><code>background</code> (text fill → <code>color</code>)</td></tr>
    <tr><td>Stroke 1, inside</td><td><code>border: 1px solid</code> with <code>box-sizing: border-box</code></td></tr>
    <tr><td>Corner radius</td><td><code>border-radius</code></td></tr>
    <tr><td>Drop shadow x, y, blur, spread, color</td><td><code>box-shadow: x y blur spread color</code></td></tr>
    <tr><td>Layer opacity</td><td><code>opacity</code>. Fill opacity → <code>rgba()</code> or 8-digit hex</td></tr>
    <tr><td>Clip content</td><td><code>overflow: hidden</code></td></tr>
    <tr><td>Absolute position (inside auto layout)</td><td><code>position: absolute</code> on the child, <code>position: relative</code> on the parent</td></tr>
    <tr><td>Text: size / line height</td><td><code>font-size</code> / <code>line-height</code> (px copies across; % → unitless, so 150% = 1.5)</td></tr>
    <tr><td>Letter spacing 2%</td><td><code>letter-spacing: 0.02em</code></td></tr>
    <tr><td>Text case: Upper</td><td><code>text-transform: uppercase</code></td></tr>
    <tr><td>Truncate text</td><td><code>white-space: nowrap; overflow: hidden; text-overflow: ellipsis</code></td></tr>
  </table></div>

  <h2>Order of fidelity</h2>
  <ol>
    <li>Layout structure: rows, columns, what fills and what hugs</li>
    <li>Spacing scale: the gaps and paddings (they usually repeat: 4, 8, 12, 16, 24)</li>
    <li>Typography: size, weight, line height</li>
    <li>Colors (use the codebase's variables)</li>
    <li>Radius, borders, shadows</li>
    <li>States: hover, focus, active, disabled. Designs often show these in a separate frame, so look for one.</li>
  </ol>
  <p>If the design uses a font the codebase doesn't load, keep the codebase font and mention it. Don't burn time on it.</p>

  <h2>Practice with the Design tab</h2>
  <p>Every drill and mock has a <strong>Design</strong> tab with a live target and an Inspect mode. Hover to read sizes, padding (shaded blue), gap, type and colors. Click to pin. It's the closest thing to Figma's inspect panel you can practice against here. Then do one round with a real Figma Community file so the actual UI isn't new on Wednesday.</p>
  <div data-quiz="figma"></div>
</template>







<template id="tpl-lookup">
  <h1>Thinking in lookups</h1>
  <p class="lede">Google and MDN are allowed. So the skill being tested isn't memory. It's how fast you get from "the design needs this" to working code. That speed comes from two habits: breaking the problem into pieces, and knowing what each piece is called.</p>

  <div class="callout is-key"><span class="callout-label">The core idea</span>
    <p>You can only search for what you can name. Almost every UI request is a combination of a few dozen named building blocks. Learn the names, and anything thrown at you becomes three or four short searches.</p></div>

  <h2>The loop</h2>
  <ol class="phases">
    <li class="phase"><span class="phase-time">1</span><div><h3>Restate it as behavior</h3><p>"When the user does X, Y appears / changes / is saved." Strip the product words. "Starred chats go to the top" becomes "items with a flag render in a separate group first."</p></div></li>
    <li class="phase"><span class="phase-time">2</span><div><h3>Break it into layers</h3><p>Ask the six questions below. Each answer is one small, searchable piece.</p></div></li>
    <li class="phase"><span class="phase-time">3</span><div><h3>Name each piece</h3><p>Is it React, plain JavaScript, a browser API, or CSS? Then its name: "debounce", "sticky", "click outside", "RelativeTimeFormat". The vocabulary page lists about 70 of these.</p></div></li>
    <li class="phase"><span class="phase-time">4</span><div><h3>Search with the formula</h3><p><b>[technology] + [exact name or precise words] + [mdn / react]</b>. Short, specific, no full sentences.</p></div></li>
    <li class="phase"><span class="phase-time">5</span><div><h3>Read the example, not the article</h3><p>Jump to the code. Copy the smallest part. Rename to your variables. Run it.</p></div></li>
    <li class="phase"><span class="phase-time">6</span><div><h3>Timebox to 2 minutes</h3><p>Not found? Say so, ship a simpler version, and note what you'd do with more time.</p></div></li>
  </ol>

  <h2>The six questions</h2>
  <p>Run every unfamiliar requirement through these. You don't need all six every time, but asking them is how you find the pieces you'd otherwise miss.</p>
  <div class="table-wrap"><table>
    <tr><th>Ask</th><th>Layer</th><th>Typical answers</th></tr>
    <tr><td>What data do I have, and what shape does the screen need?</td><td>Data</td><td>filter, sort, group, count, format a date or number</td></tr>
    <tr><td>What can change on this screen?</td><td>State</td><td>selected id, open/closed, query, list, loading, error</td></tr>
    <tr><td>What makes it change?</td><td>Event</td><td>click, typing, key press, hover, focus, scroll, resize, a timer, a response arriving</td></tr>
    <tr><td>What does each state look like?</td><td>Render + style</td><td>conditional JSX, a class name, a layout rule, an animation</td></tr>
    <tr><td>Does it need something outside React?</td><td>Browser API</td><td>clipboard, storage, timers, observers, URL, focus, scrolling</td></tr>
    <tr><td>Who else needs this state?</td><td>Placement</td><td>keep it local, or lift it to the parent</td></tr>
  </table></div>

  <h3>Worked example</h3>
  <p><em>"Add a ⋯ menu to each comment with Delete. It should close when you click elsewhere."</em></p>
  <ul>
    <li><b>State:</b> <code>menuOpen</code> per comment → it lives in a <code>Comment</code> component.</li>
    <li><b>Event:</b> button click toggles it; a click <em>outside</em> closes it. I don't know how to detect "outside" offhand → that's the piece to look up.</li>
    <li><b>Render + style:</b> <code>{menuOpen &amp;&amp; &lt;Menu/&gt;}</code>, absolutely positioned under the button. I know this.</li>
    <li><b>Name it:</b> "click outside". It involves a <code>ref</code> and a <code>document</code> listener.</li>
    <li><b>Search:</b> <code>react click outside to close dropdown</code> → the first result shows <code>ref.current.contains(e.target)</code>. Two minutes, done.</li>
  </ul>
  <p>Notice that only one of four pieces needed a search. That's typical. The breakdown tells you <em>which</em> piece to search for, so you don't google the whole feature.</p>

  <h2>Which layer → where to look</h2>
  <div class="table-wrap"><table>
    <tr><th>If the piece is…</th><th>Best source</th><th>Add to your query</th></tr>
    <tr><td>CSS (layout, text, animation)</td><td>MDN, or CSS-Tricks guides for flexbox and grid</td><td><code>css … mdn</code></td></tr>
    <tr><td>JavaScript language (arrays, strings, dates, Intl)</td><td>MDN</td><td><code>js … mdn</code></td></tr>
    <tr><td>Browser API (clipboard, storage, observers, events)</td><td>MDN</td><td><code>… api mdn</code></td></tr>
    <tr><td>React (hooks, events, refs, portals)</td><td>react.dev</td><td><code>react …</code></td></tr>
    <tr><td>"How do people usually build X in React"</td><td>Stack Overflow, blog posts</td><td><code>react … without library</code></td></tr>
    <tr><td>Accessibility (roles, keyboard)</td><td>MDN ARIA pages, the WAI-ARIA patterns site</td><td><code>aria … pattern</code></td></tr>
  </table></div>

  <h2>Queries that work, and ones that don't</h2>
  <div class="table-wrap"><table class="qcompare">
    <tr><th>Vague (slow)</th><th>Precise (fast)</th></tr>
    <tr><td>how to make text not go to next line and show dots</td><td><code>css text-overflow ellipsis</code></td></tr>
    <tr><td>react how to close popup when clicking somewhere else on page</td><td><code>react click outside to close dropdown</code></td></tr>
    <tr><td>javascript show time like facebook</td><td><code>js relative time format mdn</code></td></tr>
    <tr><td>how to make table top row not move</td><td><code>sticky table header css</code></td></tr>
    <tr><td>react wait for user to finish typing</td><td><code>react debounce input useEffect</code></td></tr>
    <tr><td>sort array with numbers in strings correctly</td><td><code>javascript natural sort localecompare numeric</code></td></tr>
  </table></div>
  <p>The left column isn't useless. When you <em>can't</em> name something, a plain description is the right first search. Read the titles of the results, pick up the real term ("oh, it's called <em>line-clamp</em>"), then search again precisely.</p>

  <h2>Reading results in 30 seconds</h2>
  <ul>
    <li><b>MDN:</b> skip the intro. Scroll to <b>Syntax</b> or the <b>Try it</b> box, then <b>Examples</b>. Use <span class="kbd">Ctrl/⌘</span> <span class="kbd">F</span> for the option name you need.</li>
    <li><b>react.dev:</b> go to the <b>Usage</b> section for patterns, and <b>Troubleshooting</b> when something misbehaves.</li>
    <li><b>Stack Overflow:</b> check the answer's date. Prefer answers using hooks (<code>useState</code>, <code>useEffect</code>). Copy the core lines, not the whole thing.</li>
    <li><b>Blog posts:</b> scroll straight to the last code block. It's usually the finished version.</li>
  </ul>

  <h2>Adapting what you find</h2>
  <p>Found code is rarely in your shape. Translate it:</p>
  <div class="table-wrap"><table>
    <tr><th>You find</th><th>Write instead</th></tr>
    <tr><td><code>this.state</code>, <code>this.setState</code></td><td><code>useState</code></td></tr>
    <tr><td><code>componentDidMount</code></td><td><code>useEffect(() =&gt; …, [])</code></td></tr>
    <tr><td><code>componentWillUnmount</code></td><td>the function returned from that effect</td></tr>
    <tr><td><code>componentDidUpdate</code> checking a prop</td><td><code>useEffect(() =&gt; …, [thatProp])</code></td></tr>
    <tr><td><code>document.querySelector('#x')</code></td><td><code>useRef</code> + <code>ref={…}</code></td></tr>
    <tr><td><code>element.addEventListener</code> in plain JS</td><td>a JSX prop (<code>onClick</code>), or a listener in an effect with cleanup for <code>window</code>/<code>document</code></td></tr>
    <tr><td><code>el.classList.add('open')</code></td><td>state + a conditional <code>className</code></td></tr>
    <tr><td>A library (lodash, moment, react-beautiful-dnd)</td><td>the native equivalent, or say you'd use the library in production</td></tr>
  </table></div>

  <h2>Narrate the lookup</h2>
  <p>Looking things up is normal on the job, and interviewers know it. What they notice is whether you knew <em>what</em> to look up.</p>
  <ul>
    <li>"This is <code>Intl.RelativeTimeFormat</code>. I'll check the exact option names on MDN."</li>
    <li>"I don't remember what this is called. It's the dash state on a checkbox. Let me search 'checkbox dash state'... it's <code>indeterminate</code>."</li>
    <li>"There are drag-and-drop libraries, but I'll use the native API here to keep it dependency-free."</li>
  </ul>

  <h2>When nothing turns up: the fallback ladder</h2>
  <ol>
    <li><b>Native HTML first.</b> <code>&lt;details&gt;</code> for expand/collapse, <code>&lt;dialog&gt;</code> for modals, <code>title</code> for tooltips, <code>&lt;input type="date"&gt;</code> for date pickers, <code>&lt;progress&gt;</code> for progress bars.</li>
    <li><b>Simpler interaction.</b> A "Load more" button instead of infinite scroll. Up/down buttons instead of drag and drop. A full date instead of "3 hours ago".</li>
    <li><b>Say what you'd do.</b> "With more time I'd swap this for IntersectionObserver." That still scores.</li>
  </ol>

  <h2>Set up your browser on Wednesday</h2>
  <ul data-checklist="lookupsetup">
    <li data-id="1">A second browser tab with developer.mozilla.org already open</li>
    <li data-id="2">react.dev/reference/react open in a third tab<small>The hooks list on the left is a fast index.</small></li>
    <li data-id="3">Know how to open DevTools on the preview (right-click → Inspect) to try CSS live</li>
    <li data-id="4">Ask the interviewer whether your own notes are allowed. If not, rely on search only</li>
  </ul>
  <p>Next: skim the vocabulary, then practice the loop on 24 scenarios in <a href="#names" data-goto="names">Name it, search it</a>.</p>
</template>

<template id="tpl-talk">
  <h1>Talking while you code</h1>
  <p class="lede">The interviewer can only score what they can see or hear. Narration makes your judgment visible. Silence for five minutes reads as stuck, even when you're not.</p>

  <h2>Opening (first 5 minutes)</h2>
  <ul>
    <li>"Let me read the whole task and look at the design before I touch code."</li>
    <li>"I'll take a few minutes to find my way around the codebase: where this mounts, where the data comes from, and what I can reuse."</li>
    <li>"I see a <code>formatDate</code> helper and the CSS uses variables, so I'll use those."</li>
  </ul>

  <h2>Clarifying questions worth asking</h2>
  <ul>
    <li>"Should I treat the API as fixed, or can I change it?"</li>
    <li>"Is this design the only breakpoint, or should it work on mobile too?"</li>
    <li>"Are hover and focus states in another frame, or should I use my judgment?"</li>
    <li>"What should happen when the list is empty or the request fails?"</li>
    <li>"Do you care more about getting everything working, or about matching the design closely?"</li>
  </ul>
  <p>Ask two or three, not ten. If the answer is "your call", make a call and say it.</p>

  <h2>Scoping</h2>
  <p>"I'll get the list and grouping fully working first, then search, then starring. I'll add loading and empty states, and leave keyboard shortcuts for the end if there's time."</p>

  <h2>While building</h2>
  <ul>
    <li>"I'll hardcode one row first to get the markup right, then map over the data."</li>
    <li>"The filtered list is derived from the query, so I won't put it in state."</li>
    <li>"I'm putting the selected id in the parent because both the list and the detail need it."</li>
    <li>"I'll come back to the exact spacing. Getting the behavior working first."</li>
  </ul>

  <h2>When stuck</h2>
  <ul>
    <li>"This isn't truncating. My guess is the flex child needs <code>min-width: 0</code>. Let me check."</li>
    <li>"I've spent a few minutes on this. I'll take the simpler approach and note the tradeoff."</li>
    <li>It's fine to ask: "Is it OK if I look up the exact syntax for <code>line-clamp</code> on MDN?"</li>
  </ul>

  <h2>When the requirement changes</h2>
  <p>"OK, starred chats go in their own section. Grouping is already derived from the list, so this is one more section built from the same data, plus a filter on the date groups. Small change."</p>

  <h2>Closing</h2>
  <p>"Here's what works. Here's what I'd do next with more time: keyboard navigation, tests for the grouping helper, and the mobile layout. One tradeoff I made was optimistic updates without rollback."</p>

  <h2>Avoid</h2>
  <ul>
    <li>Apologizing for every typo. Fix it and keep going.</li>
    <li>Arguing with the design. Ask, then follow it.</li>
    <li>Narrating keystrokes ("now I'm typing const…"). Narrate decisions.</li>
  </ul>
</template>

<template id="tpl-debug">
  <h1>Debugging fast</h1>
  <p class="lede">Read the first line of the error. It almost always names the problem. Then check the one most likely cause before trying anything else.</p>
  <div class="table-wrap"><table>
    <tr><th>You see</th><th>Usual cause</th><th>Fix</th></tr>
    <tr><td>Objects are not valid as a React child</td><td>Rendering <code>{user}</code></td><td>Render a field: <code>{user.name}</code></td></tr>
    <tr><td>Cannot read properties of undefined (reading 'map')</td><td>Data not loaded yet, or a different shape than you think</td><td>Initialize to <code>[]</code>, show loading, check api.js</td></tr>
    <tr><td>Too many re-renders</td><td><code>onClick={setX(1)}</code>, or setState during render</td><td><code>onClick={() =&gt; setX(1)}</code></td></tr>
    <tr><td>Each child in a list should have a unique "key"</td><td>Missing or duplicate key</td><td><code>key={item.id}</code> on the outermost element in map</td></tr>
    <tr><td>Element type is invalid… got: undefined</td><td>Default vs named import mismatch</td><td>Match the export: <code>import X</code> vs <code>import { X }</code></td></tr>
    <tr><td>Module not found: Can't resolve './X'</td><td>Wrong path, case or folder</td><td>Check the tree. <code>../</code> goes up a folder</td></tr>
    <tr><td>Input won't accept typing</td><td><code>value</code> without <code>onChange</code></td><td>Add <code>onChange</code> that sets state</td></tr>
    <tr><td>UI doesn't update after a change</td><td>Mutated state (<code>push</code>, <code>sort</code>, <code>obj.x = …</code>)</td><td>New array or object: spread, map, filter</td></tr>
    <tr><td>Effect runs in a loop</td><td>It sets state that's in its own dependency array</td><td>Fix the dependencies, or derive instead of syncing</td></tr>
    <tr><td>Value is stale right after setState</td><td>State updates on the next render</td><td>Use the value you just computed, or <code>prev =&gt;</code></td></tr>
    <tr><td>Text overflows instead of truncating</td><td>Flex child with min-width:auto</td><td><code>min-width: 0</code> on the flex child</td></tr>
    <tr><td><code>height: 100%</code> does nothing</td><td>Parent has no defined height</td><td>Give the chain a height, or use flex</td></tr>
    <tr><td>A "0" appears on the page</td><td><code>{count &amp;&amp; …}</code> with count 0</td><td><code>{count &gt; 0 &amp;&amp; …}</code></td></tr>
  </table></div>

  <h2>The method</h2>
  <ol>
    <li>Read the error's first line and the file and line number.</li>
    <li>Say your guess out loud.</li>
    <li>Check it with a <code>console.log</code> right before the failing line, or in the Console tab.</li>

  <script type="text/x-code" data-lang="jsx" data-title="component skeleton">
import React, { useEffect, useState } from 'react';
import { getThings } from '../api';

export default function ThingList({ onSelect, selectedId }) {
  const [things, setThings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [query, setQuery] = useState('');

  useEffect(() => {
    let cancelled = false;
    getThings().then((d) => { if (!cancelled) { setThings(d); setLoading(false); } });
    return () => { cancelled = true; };
  }, []);

  const q = query.trim().toLowerCase();
  const visible = things.filter((t) => t.name.toLowerCase().includes(q));

  return (
    <section className="thing-list">
      <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search" />
      {loading && <p>Loading…</p>}
      {!loading && visible.length === 0 && <p>No matches.</p>}
      <ul>
        {visible.map((t) => (
          <li key={t.id}>
            <button className={t.id === selectedId ? 'is-active' : ''} onClick={() => onSelect(t.id)}>
              {t.name}
            </button>
          </li>
        ))}
      </ul>
    </section>
  );
}
</script>
