<title>Mock-Up Round Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: guide = sticky module index + one reading column; workspace = 4-pane IDE (task | files | editor | preview+terminal), always dark. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --surface-2: #EBEDF2;
  --ink: #141924;
  --muted: #586074;
  --line: #DADEE6;
  --accent: #CC2F5A;          /* redline magenta, like spec measurements */
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE7ED;
  --ok: #1E7F4A;
  --ok-soft: #E2F3E9;
  --warn: #9A5B00;
  --warn-soft: #FFF1D6;
  --code-bg: #ECEEF3;
  --code-ink: #1D2433;
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* workspace (always dark) */
  --ide-bg: #0D1322;
  --ide-panel: #121A2C;
  --ide-panel-2: #172036;
  --ide-raised: #1E2942;
  --ide-line: #24304B;
  --ide-text: #D5DCEA;
  --ide-muted: #8390AA;
  --ide-blue: #4C82FF;
  --ide-green: #2FB67C;
  --ide-amber: #F2B441;
  --ide-red: #FF6B6B;
  --syn-kw: #C792EA;
  --syn-str: #C3E88D;
  --syn-num: #F78C6C;
  --syn-tag: #F07178;
  --syn-fn: #82AAFF;
  --syn-com: #637394;
  --syn-prop: #89DDFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1118; --surface: #161A24; --surface-2: #1D2230; --ink: #E7EAF1; --muted: #9AA2B4;
    --line: #2A3040; --accent: #FF5E8A; --accent-ink: #1A0A10; --accent-soft: #3A1824;
    --ok: #4CC487; --ok-soft: #14301F; --warn: #F2B441; --warn-soft: #33260C;
    --code-bg: #1C2130; --code-ink: #DCE2EE; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1118; --surface: #161A24; --surface-2: #1D2230; --ink: #E7EAF1; --muted: #9AA2B4;
  --line: #2A3040; --accent: #FF5E8A; --accent-ink: #1A0A10; --accent-soft: #3A1824;
  --ok: #4CC487; --ok-soft: #14301F; --warn: #F2B441; --warn-soft: #33260C;
  --code-bg: #1C2130; --code-ink: #DCE2EE; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body.ide-open { overflow: hidden; }
button { font: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Guide shell ---------- */
.g-top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.toc-toggle { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; }
.toc-toggle:hover { border-color: var(--muted); }
body.toc-collapsed .toc { display: none; }
body.toc-collapsed .g-layout { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
body.toc-collapsed .toc-select { display: block; width: 100%; max-width: 720px; margin: 16px 0 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; }
.brand-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.progress-bar { width: 120px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

.g-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; padding: 0 24px; gap: 40px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); align-self: start; padding-block: 28px; max-height: calc(100vh - 70px); overflow-y: auto; }
.toc-group { margin: 18px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toc-group:first-child { margin-top: 0; }
.toc-link {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 4px;
  width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: none;
  text-align: left; color: var(--ink); font-size: 14px; line-height: 1.35; cursor: pointer;
}
.toc-link:hover { background: var(--surface-2); }
.toc-link.is-current { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.toc-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.toc-dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.toc-link.is-done .toc-dot { background: var(--ok); }
.toc-select { display: none; }

.content { padding-block: 36px 96px; min-width: 0; }
.module { max-width: 720px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; margin: 0 0 6px; }
.module h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4vw, 42px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 14px; text-wrap: balance; }
.lede { font-size: 18px; color: var(--muted); margin: 0 0 28px; max-width: 62ch; }
.module h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; margin: 44px 0 10px; text-wrap: balance; }
.module h3 { font-size: 17px; font-weight: 600; margin: 28px 0 6px; }
.module p, .module li { max-width: 66ch; }
.module ul, .module ol { padding-left: 22px; }
.module li + li { margin-top: 4px; }
.module code:not(pre code) { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); color: var(--code-ink); padding: 1px 5px; border-radius: 4px; }
.module strong { font-weight: 600; }

.callout { display: grid; gap: 4px; margin: 20px 0; padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.callout-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.callout.is-key { border-color: var(--accent); background: var(--accent-soft); }
.callout.is-key .callout-label { color: var(--accent); }
.callout p { margin: 0; }

.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: 14px; }
.table-wrap th, .table-wrap td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table-wrap th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.table-wrap tr:last-child td { border-bottom: 0; }
.table-wrap td code { white-space: nowrap; }

.snippet { margin: 14px 0 20px; border-radius: 10px; overflow: hidden; background: var(--ide-panel); border: 1px solid var(--ide-line); }
.snippet-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-family: var(--font-mono); font-size: 11px; color: var(--ide-muted); border-bottom: 1px solid var(--ide-line); }
.snippet-bar button { border: 0; background: none; color: var(--ide-muted); cursor: pointer; font-size: 11px; font-family: var(--font-mono); padding: 2px 6px; border-radius: 4px; }
.snippet-bar button:hover { color: var(--ide-text); background: var(--ide-raised); }
.snippet pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; color: var(--ide-text); tab-size: 2; }

/* timeline for the playbook */
.phases { list-style: none; padding: 0 !important; margin: 18px 0; display: grid; gap: 0; }
.phase { display: grid; grid-template-columns: 76px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.phase:last-child { border-bottom: 1px solid var(--line); }
.phase-time { font-family: var(--font-mono); font-size: 13px; color: var(--accent); padding-top: 2px; }
.phase h3 { margin: 0 0 4px; }
.phase p { margin: 0; }
.phase-bar { height: 6px; border-radius: 3px; background: var(--accent); opacity: .85; margin-top: 8px; }

/* checklists */
.checklist { list-style: none; padding: 0 !important; margin: 12px 0 20px; display: grid; gap: 6px; }
.checklist li { margin: 0 !important; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.check input { margin-top: 5px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
.check.is-done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.check small { display: block; color: var(--muted); font-size: 13px; }

/* quiz */
.quiz { margin: 22px 0; display: grid; gap: 14px; }
.quiz-head { display: flex; justify-content: space-between; align-items: baseline; }
.quiz-head h3 { margin: 0; }
.quiz-score { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.q { padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.q-text { margin: 0 0 10px; font-weight: 500; }
.q-opts { display: grid; gap: 6px; }
.q-opt { text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; font-size: 15px; line-height: 1.4; }
.q-opt:hover:not(:disabled) { border-color: var(--muted); }
.q-opt:disabled { cursor: default; }
.q-opt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.q-opt.is-wrong { border-color: var(--accent); background: var(--accent-soft); }
.q-why { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.q-why b { color: var(--ink); }
.q-opt code { font-family: var(--font-mono); font-size: .86em; }

/* exercise cards */
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin: 16px 0 24px; }
.ex-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.ex-meta { display: flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ex-tag { padding: 2px 7px; border-radius: 999px; background: var(--surface-2); }
.ex-tag.is-mock { background: var(--accent-soft); color: var(--accent); }
.ex-status { margin-left: auto; text-transform: none; letter-spacing: 0; }
.ex-status.is-done { color: var(--ok); }
.ex-card h3 { margin: 0 !important; font-size: 17px; }
.ex-card p { margin: 0; font-size: 14px; color: var(--muted); }
.ex-skills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
.ex-skills span { font-size: 12px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.ex-tag.is-curve { background: var(--warn-soft); color: var(--warn); }

/* lookup vocabulary */
.vocab-tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 16px 0 4px; }
.vocab-filter { flex: 1; min-width: 200px; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; }
.vocab-toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.vocab-toggle input { accent-color: var(--accent); }
.vocab-table td:first-child { width: 38%; }
.vocab-table td:nth-child(2) { width: 30%; font-weight: 500; }
.vocab-name { border-radius: 4px; transition: background .15s, color .15s; }
.vocab-name.is-hidden { color: transparent; background: var(--surface-2); cursor: pointer; user-select: none; }
.q-link { font-family: var(--font-mono); font-size: 13px; color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.q-link:hover { text-decoration: underline; }

/* query comparison */
.qcompare td:first-child { color: var(--muted); }
.qcompare td:last-child code { color: var(--ok) !important; }

/* lookup drill */
.ld { display: grid; gap: 14px; margin: 20px 0; }
.ld-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.ld-stats, .ld-ctrl { display: flex; flex-wrap: wrap; gap: 6px; }
.ld-pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.ld-pill.is-got { background: var(--ok-soft); color: var(--ok); }
.ld-pill.is-part { background: var(--warn-soft); color: var(--warn); }
.ld-pill.is-miss { background: var(--accent-soft); color: var(--accent); }
.ld-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; cursor: pointer; }
.ld-btn:hover:not(:disabled) { border-color: var(--muted); }
.ld-btn:disabled { opacity: .45; cursor: default; }
.ld-btn.is-on { border-color: var(--accent); color: var(--accent); }
.ld-btn.is-got { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.ld-btn.is-part { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.ld-btn.is-miss { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ld-card { display: grid; gap: 12px; padding: 20px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.ld-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.ld-clock { font-weight: 500; color: var(--ink); }
.ld-clock.is-low { color: var(--accent); }
.ld-prompt { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; max-width: none !important; }
.ld-label { font-size: 13px; color: var(--muted); }
.ld-ans { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font-mono); resize: vertical; }
.ld-reveal { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; padding-top: 4px; border-top: 1px solid var(--line); }
.ld-reveal h4 { margin: 10px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ld-reveal ul { margin: 0; padding-left: 18px; font-size: 14px; }
.ld-reveal li + li { margin-top: 4px; }
.ld-card .snippet { margin: 0; }
.ld-tip { margin: 0; font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); max-width: none !important; }
.ld-grade { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.ld-grade span { margin-right: 4px; }
.ld-nav { display: flex; justify-content: space-between; gap: 8px; }

/* inline playground */
.play { margin: 18px 0 8px; border-radius: 12px; overflow: hidden; border: 1px solid var(--ide-line); background: var(--ide-bg); color: var(--ide-text); font-size: 13px; }
.play-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 8px 6px 12px; background: var(--ide-panel); border-bottom: 1px solid var(--ide-line); }
.play-title { font-weight: 600; font-size: 13px; color: #fff; }
.play-tabs { display: flex; gap: 2px; }
.play-tab { border: 0; background: transparent; color: var(--ide-muted); padding: 3px 9px; border-radius: 5px; font: 12px var(--font-mono); cursor: pointer; }
.play-tab.is-on { background: var(--ide-raised); color: var(--ide-text); }
.play-status { margin-left: auto; font-size: 11px; color: var(--ide-muted); }
.play-status.is-ok { color: var(--ide-green); }
.play-status.is-err { color: var(--ide-red); }
.play-btn { border: 1px solid var(--ide-line); background: var(--ide-panel-2); color: var(--ide-text); border-radius: 5px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
.play-btn:hover { background: var(--ide-raised); }
.play-editor { position: relative; }
.play-editor .ce-hl, .play-editor .ce-ta { padding-bottom: 16px; }
.play-out { border-top: 1px solid var(--ide-line); }
.play-label { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ide-muted); background: var(--ide-panel); }
.play-label span { font-weight: 400; letter-spacing: 0; text-transform: none; }
.play-preview { position: relative; background: #fff; transform: translateZ(0); }
.play-host { position: relative; min-height: 64px; max-height: 440px; overflow: auto; color-scheme: light; }
.play-preview[style] .play-host { position: absolute; inset: 0; max-height: none; }
.play-msg { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 12px; background: #fff; color: #6B7385; font: 13px var(--font-body); text-align: center; }
.play-msg.is-err { place-items: start; text-align: left; background: #FFF5F5; color: #B42318; font: 12px/1.5 var(--font-mono); white-space: pre-wrap; overflow: auto; }
.play-console-label { border-top: 1px solid var(--ide-line); }
.play-clear { margin-left: auto; border: 0; background: none; color: var(--ide-muted); font-size: 11px; cursor: pointer; text-transform: none; letter-spacing: 0; }
.play-console { max-height: 150px; min-height: 30px; overflow: auto; padding: 6px 12px 8px; font: 12px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.play-console > div { padding: 1px 0; border-bottom: 1px solid #141C30; }
.pc-empty { color: #44506C; border: 0 !important; }
.pc-error { color: var(--ide-red); }
.pc-warn { color: var(--ide-amber); }
.pc-n { display: inline-block; min-width: 18px; margin-right: 6px; padding: 0 5px; border-radius: 9px; background: var(--ide-raised); color: var(--ide-muted); font-size: 10px; text-align: center; }

.try { margin: 0 0 22px; padding: 12px 16px 12px 16px; border-radius: 0 0 10px 10px; background: var(--surface); border: 1px solid var(--line); border-top: 0; font-size: 15px; }
.try > b:first-child { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.try ol, .try ul { margin: 4px 0 0; }
.play + .try { margin-top: -9px; }

/* explorer */
.explorer { margin: 18px 0 22px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 12px; }
.explorer-controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; }
.explorer-controls label { display: grid; gap: 3px; font: 12px var(--font-mono); color: var(--muted); }
.explorer-controls select { height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 13px var(--font-mono); }
.explorer-stage { display: grid; gap: 6px; }
.explorer-box { min-height: 170px; padding: 10px; border-radius: 8px; border: 2px dashed var(--accent); background: repeating-linear-gradient(45deg, transparent 0 8px, var(--surface-2) 8px 9px); }
.explorer-item { border-radius: 6px; background: var(--ink); color: var(--bg); font: 600 13px var(--font-body); }
.explorer-item.is-picked { background: var(--accent); color: var(--accent-ink); }
.explorer-axis { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font: 12px var(--font-mono); color: var(--muted); }
.explorer .snippet { margin: 0; }

/* box model diagram */
.boxmodel { margin: 18px 0; padding: 22px; border: 2px dashed #E3A73A; border-radius: 10px; position: relative; background: rgba(227, 167, 58, .08); font: 12px var(--font-mono); }
.boxmodel > span, .bm-border > span, .bm-pad > span { position: absolute; top: 3px; left: 8px; color: var(--muted); }
.bm-border { position: relative; padding: 22px; border: 6px solid var(--ink); border-radius: 6px; }
.bm-border > span { top: -2px; color: var(--muted); }
.bm-pad { position: relative; padding: 24px; background: rgba(76, 130, 255, .18); }
.bm-content { padding: 16px; text-align: center; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }

/* lesson structure */
.goals { margin: 0 0 24px; padding: 14px 18px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.goals b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.goals ul { margin: 0; }
.q-code { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--ide-panel); color: var(--ide-text); font: 12.5px/1.55 var(--font-mono); overflow-x: auto; white-space: pre; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 16px 0; font-size: 14px; }
.flow span { padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.flow i { color: var(--accent); font-style: normal; font-weight: 600; }
.mistake { margin: 10px 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; }
.mistake p { margin: 4px 0 0; }

/* gotchas */
.gt-list { display: grid; gap: 12px; margin: 12px 0 8px; }
.gt { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.gt h3 { margin: 0 0 6px !important; font-size: 16px; }
.gt-sym { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.gt pre { margin: 6px 0 0; padding: 8px 10px 8px 30px; border-radius: 8px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); white-space: pre; position: relative; }
.gt pre::before { position: absolute; left: 10px; top: 8px; font-weight: 700; }
.gt-bad { background: var(--accent-soft); color: var(--ink); }
.gt-bad::before { content: '✗'; color: var(--accent); }
.gt-good { background: var(--ok-soft); color: var(--ink); }
.gt-good::before { content: '✓'; color: var(--ok); }
.gt-rule { margin: 8px 0 0; font-size: 14px; font-weight: 500; }

/* before → after and traces */
.ba { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; margin: 14px 0; }
.ba > div { min-width: 0; }
.ba span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.ba pre { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--ide-panel); color: var(--ide-text); font: 12.5px/1.55 var(--font-mono); overflow-x: auto; white-space: pre; }
.ba > i { font-style: normal; font-weight: 700; color: var(--accent); }
@media (max-width: 640px) { .ba { grid-template-columns: minmax(0, 1fr); } .ba > i { justify-self: center; } }
.trace { margin: 12px 0; padding: 12px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.trace > b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.trace ol { margin: 0; padding-left: 20px; font-size: 15px; }
.trace .yes { color: var(--ok); }
.trace .no { color: var(--accent); }

/* data drills */
.katas { display: grid; gap: 16px; margin: 12px 0 24px; }
.kata { padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px; min-width: 0; }
.kata-head { display: flex; align-items: center; gap: 10px; }
.kata-head h3 { margin: 0 !important; font-size: 17px; }
.kata-status { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: var(--ok); }
.kata-status.is-done { border-color: var(--ok); background: var(--ok-soft); }
.kata-prompt { margin: 0; font-size: 15px; }
.kata-want { margin: 0; font-size: 14px; color: var(--muted); }
.kata-data summary { cursor: pointer; font-size: 14px; color: var(--muted); }
.kata-data pre, .kata-out pre, .kata-solcode { margin: 6px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--ide-panel); color: var(--ide-text); font: 12px/1.55 var(--font-mono); max-height: 260px; overflow: auto; white-space: pre; }
.kata-editor { position: relative; height: 150px; border-radius: 8px; overflow: hidden; border: 1px solid var(--ide-line); background: var(--ide-bg); color: var(--ide-text); }
.kata-editor .ce-hl, .kata-editor .ce-ta { padding-bottom: 12px; }
.kata-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.kata-run { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.kata-verdict { font-size: 14px; font-weight: 500; }
.kata-verdict.is-ok { color: var(--ok); }
.kata-verdict.is-bad { color: var(--accent); }
.kata-verdict.is-warn { color: var(--warn); }
.kata-hinttext { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 14px; }
.kata-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.kata-out > div { min-width: 0; }
.kata-out-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.kata-out-label span { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--font-mono); color: var(--ink); }
.kata-why { padding: 10px 12px; border-radius: 8px; background: var(--ok-soft); font-size: 14px; }
.kata-why .kata-solcode:empty { display: none; }
.pager-cta { margin: 20px 0 0; }

.btn-open {
  margin-top: 6px; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 8px; border: 0; background: var(--ink); color: var(--bg);
  font-weight: 600; font-size: 14px; cursor: pointer;
}
.btn-open:hover { opacity: .88; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); }
.pager button { display: grid; gap: 2px; text-align: left; max-width: 48%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.pager button:hover { border-color: var(--muted); }
.pager .next { text-align: right; margin-left: auto; }
.pager small { color: var(--muted); font-size: 12px; }

.kbd { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); white-space: nowrap; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 100; max-width: min(520px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 10px;
  background: #1B2236; color: #EEF2FA; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.35);
  border: 1px solid #2E3A58;
}
.toast b { color: var(--ide-amber); }

@media (max-width: 900px) {
  .g-layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 16px; }
  .toc { display: none; }
  .toc-toggle { display: none; }
  .toc-select { display: block; width: 100%; margin: 16px 0 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
  .g-top { padding: 10px 16px; }
  .content { padding-block: 8px 72px; }
  .module h1 { margin-top: 8px; }
  .brand-sub { display: none; }
  .progress-bar { width: 64px; }
  .phase { grid-template-columns: 56px 1fr; gap: 10px; }
}

/* ---------- Workspace (CodeSignal-style IDE) ---------- */
.ide {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--ide-bg); color: var(--ide-text);
  font-family: var(--font-body); font-size: 13px; line-height: 1.45;
  color-scheme: dark;
}
.ide button { color: inherit; }
.ide-top {
  display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px;
  background: var(--ide-panel); border-bottom: 1px solid var(--ide-line); flex-shrink: 0;
}
.ide-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border-radius: 6px; border: 1px solid var(--ide-line); background: var(--ide-panel-2);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.ide-btn:hover { background: var(--ide-raised); }
.ide-btn.is-primary { background: var(--ide-blue); border-color: var(--ide-blue); color: #fff; font-weight: 600; }
.ide-btn.is-primary:hover { background: #3A70F0; }
.ide-btn svg { width: 14px; height: 14px; }
.ide-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ide-title strong { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ide-kind { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; background: var(--ide-raised); color: var(--ide-muted); white-space: nowrap; }
.ide-spacer { flex: 1; }
.timer { display: flex; align-items: center; gap: 6px; }
.timer-val { font-family: var(--font-mono); font-size: 15px; font-weight: 500; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.timer.is-low .timer-val { color: var(--ide-amber); }
.timer.is-over .timer-val { color: var(--ide-red); }
.timer-btn { height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--ide-line); background: transparent; cursor: pointer; font-size: 12px; }
.timer-btn:hover { background: var(--ide-raised); }

.ide-body { flex: 1; min-height: 0; display: flex; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ide-panel); }
.pane-task { width: var(--task-w, 340px); flex-shrink: 0; border-right: 1px solid var(--ide-line); }
.pane-task.is-collapsed { display: none; }
.pane-files { width: 190px; flex-shrink: 0; border-right: 1px solid var(--ide-line); background: var(--ide-bg); }
.pane-editor { flex: 1; background: var(--ide-bg); }
.pane-right { width: var(--right-w, 42%); flex-shrink: 0; border-left: 1px solid var(--ide-line); }
.splitter { width: 5px; margin: 0 -3px; z-index: 2; cursor: col-resize; flex-shrink: 0; position: relative; }
.splitter:hover, .splitter.is-drag { background: var(--ide-blue); }
.hsplit { height: 5px; margin: -3px 0; z-index: 2; cursor: row-resize; flex-shrink: 0; position: relative; }
.hsplit:hover, .hsplit.is-drag { background: var(--ide-blue); }

.tabs { display: flex; align-items: stretch; height: 36px; flex-shrink: 0; border-bottom: 1px solid var(--ide-line); background: var(--ide-panel); overflow-x: auto; scrollbar-width: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border: 0; border-right: 1px solid var(--ide-line);
  background: transparent; color: var(--ide-muted); font-size: 13px; cursor: pointer; white-space: nowrap; position: relative;
}
.tab:hover { color: var(--ide-text); }
.tab.is-active { color: var(--ide-text); background: var(--ide-bg); }
.tab.is-active::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--ide-blue); }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ide-amber); }
.tab-close { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; color: var(--ide-muted); font-size: 14px; line-height: 1; }
.tab-close:hover { background: var(--ide-raised); color: var(--ide-text); }
.tabs-tools { margin-left: auto; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 5px; border: 0; background: transparent; color: var(--ide-muted); cursor: pointer; }
.icon-btn:hover { background: var(--ide-raised); color: var(--ide-text); }
.icon-btn svg { width: 15px; height: 15px; }

/* task pane */
.task-scroll { flex: 1; overflow-y: auto; padding: 16px 18px 40px; font-size: 14px; line-height: 1.55; }
.task-scroll h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 6px; color: #fff; letter-spacing: -0.01em; }
.task-scroll h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ide-muted); margin: 22px 0 8px; }
.task-scroll p { margin: 0 0 10px; }
.task-scroll ul, .task-scroll ol { margin: 0 0 10px; padding-left: 20px; }
.task-scroll li + li { margin-top: 4px; }
.task-scroll code { font-family: var(--font-mono); font-size: 12px; background: var(--ide-raised); padding: 1px 5px; border-radius: 4px; color: #E7ECF6; }
.task-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.task-meta span { font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--ide-raised); color: var(--ide-muted); }

.prims { margin: 14px 0; padding: 10px 12px; border: 1px solid var(--ide-line); border-radius: 8px; background: var(--ide-panel-2); }
.prims h3 { margin: 0 0 4px; }
.prims-lede { margin: 0 0 8px; font-size: 12px; color: var(--ide-muted); }
.prim { padding: 8px 0; border-top: 1px solid var(--ide-line); }
.prim:first-of-type { border-top: 0; }
.prim-head { display: flex; align-items: center; gap: 8px; }
.prim-name { font-size: 13px; font-weight: 600; }
.prim-cat { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ide-muted); margin-left: auto; }
.prim-code { margin: 6px 0 4px; padding: 6px 8px; border-radius: 6px; background: var(--ide-bg); font: 12px/1.5 var(--font-mono); white-space: pre-wrap; }
.prim-note { margin: 0; font-size: 12px; color: var(--ide-muted); }
.prim-note a { color: var(--ide-blue); }
.prim-table td code { white-space: pre-wrap; }

.req { list-style: none; padding: 0 !important; display: grid; gap: 4px; }
.req label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.req label:hover { background: var(--ide-panel-2); }
.req input { margin-top: 4px; accent-color: var(--ide-green); flex-shrink: 0; }
.req input:checked + span { color: var(--ide-muted); text-decoration: line-through; }
.change-box { margin: 18px 0; padding: 14px; border-radius: 8px; border: 1px dashed var(--ide-line); background: var(--ide-panel-2); }
.change-box.is-live { border: 1px solid var(--ide-amber); background: #2A2412; }
.change-box h4 { margin: 0 0 6px; font-size: 14px; color: var(--ide-amber); display: flex; align-items: center; gap: 8px; }
.change-box p:last-child { margin-bottom: 0; }
.details { margin: 10px 0; border: 1px solid var(--ide-line); border-radius: 8px; }
.details summary { padding: 8px 12px; cursor: pointer; font-weight: 500; }
.details > div { padding: 0 12px 10px; }
.done-btn { margin-top: 18px; }

/* design pane */
.design-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ide-body { position: relative; }
.pane-task.is-wide { position: absolute; inset: 0; width: auto; z-index: 20; box-shadow: 0 0 0 1px var(--ide-line); }
.pane-task.is-wide .design-scroll { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto 1fr; align-items: start; }
.pane-task.is-wide .spec { align-self: start; }
.pane-task.is-wide .design-canvas { grid-row: 1 / span 2; height: calc(100vh - 150px); min-height: 360px; }
.pane-task.is-wide .inspect-info { margin-top: 14px; }
.design-bar .ide-btn { margin-left: auto; height: 26px; font-size: 12px; }
.design-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--ide-line); flex-shrink: 0; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 2px; border-radius: 6px; background: var(--ide-bg); border: 1px solid var(--ide-line); }
.seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; color: var(--ide-muted); }
.seg button.is-on { background: var(--ide-raised); color: var(--ide-text); }
.design-hint { font-size: 12px; color: var(--ide-muted); }
.design-scroll { flex: 1; overflow: auto; min-height: 0; }
.design-canvas { position: relative; margin: 14px; border-radius: 6px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--ide-line); height: 420px; resize: vertical; }
.design-host { position: absolute; inset: 0; overflow: auto; }
.inspect-box { position: absolute; pointer-events: none; z-index: 5; outline: 1px solid #F0247A; background: rgba(240, 36, 122, .08); }
.inspect-label { position: absolute; top: -20px; left: -1px; padding: 1px 5px; border-radius: 3px; background: #F0247A; color: #fff; font: 500 11px/16px var(--font-mono); white-space: nowrap; }
.inspect-pad { position: absolute; pointer-events: none; z-index: 4; background: rgba(76, 130, 255, .18); }
.inspect-info { margin: 0 14px 14px; border: 1px solid var(--ide-line); border-radius: 8px; overflow: hidden; }
.inspect-info-head { padding: 8px 12px; font-family: var(--font-mono); font-size: 12px; background: var(--ide-panel-2); border-bottom: 1px solid var(--ide-line); color: #fff; overflow-wrap: anywhere; }
.inspect-info dl { margin: 0; display: grid; grid-template-columns: 110px 1fr; font-size: 12px; }
.inspect-info dt, .inspect-info dd { margin: 0; padding: 5px 12px; border-bottom: 1px solid var(--ide-line); }
.inspect-info dt { color: var(--ide-muted); }
.inspect-info dd { font-family: var(--font-mono); color: var(--ide-text); overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.inspect-empty { padding: 12px; color: var(--ide-muted); font-size: 12px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); flex-shrink: 0; }
.spec { margin: 0 14px 18px; }
.spec h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ide-muted); margin: 16px 0 8px; }
.spec-colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.spec-color { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: var(--ide-panel-2); font-size: 12px; border: 0; color: inherit; cursor: pointer; text-align: left; }
.spec-color:hover { background: var(--ide-raised); }
.spec-color .swatch { width: 18px; height: 18px; }
.spec-color span { display: grid; line-height: 1.25; min-width: 0; }
.spec-color small { font-family: var(--font-mono); color: var(--ide-muted); }
.spec-list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.spec-list li { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--ide-line); }
.spec-list li span:first-child { color: var(--ide-muted); }
.spec-list li span:last-child { font-family: var(--font-mono); font-size: 12px; }

/* solution pane */
.sol-gate { padding: 24px 18px; text-align: center; color: var(--ide-muted); display: grid; gap: 12px; justify-items: center; }
.sol-file { margin: 12px 14px; border: 1px solid var(--ide-line); border-radius: 8px; overflow: hidden; }
.sol-file-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-family: var(--font-mono); font-size: 12px; background: var(--ide-panel-2); border-bottom: 1px solid var(--ide-line); }
.sol-file pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; background: var(--ide-bg); }

/* file tree */
.files-head { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 6px 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ide-muted); border-bottom: 1px solid var(--ide-line); flex-shrink: 0; }
.tree { flex: 1; overflow-y: auto; padding: 6px 0; font-size: 13px; }
.tree-row { display: flex; align-items: center; gap: 6px; width: 100%; height: 26px; padding-right: 8px; border: 0; background: transparent; text-align: left; cursor: pointer; color: var(--ide-text); white-space: nowrap; }
.tree-row:hover { background: var(--ide-panel-2); }
.tree-row.is-active { background: var(--ide-raised); }
.tree-row .ic { width: 14px; flex-shrink: 0; display: grid; place-items: center; font-size: 10px; color: var(--ide-muted); }
.tree-row .name { overflow: hidden; text-overflow: ellipsis; }
.tree-row.is-dir .name { color: var(--ide-muted); }
.ft { font-family: var(--font-mono); font-size: 9px; font-weight: 600; width: 22px; flex-shrink: 0; }
.ft-jsx { color: #61DAFB; } .ft-js { color: #F7DF1E; } .ft-tsx { color: #3B9BEB; } .ft-ts { color: #3178C6; } .ft-css { color: #6FA8FF; } .ft-json { color: #F2B441; }
.new-file { display: flex; gap: 4px; padding: 4px 8px; }
.new-file input { flex: 1; min-width: 0; height: 26px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--ide-blue); background: var(--ide-bg); color: var(--ide-text); font: 12px var(--font-mono); }
.new-file-err { padding: 0 10px 4px; font-size: 11px; color: var(--ide-red); }

/* editor */
.editor-area { flex: 1; min-height: 0; position: relative; }
.ce { position: absolute; inset: 0; display: flex; overflow: hidden; font-family: var(--font-mono); font-size: 13px; line-height: 20px; }
.ce-gutter { width: 50px; flex-shrink: 0; overflow: hidden; background: var(--ide-bg); border-right: 1px solid #182239; }
.ce-lines { padding: 12px 10px 12px 0; text-align: right; color: #44506C; white-space: pre; will-change: transform; }
